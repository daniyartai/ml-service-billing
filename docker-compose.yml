services:

  # 1. Backend-приложение.
  # Конфигурация — через env_file, исходники — через volumes.
  # Порты наружу НЕ пробрасываются: доступ только через web-proxy.
  app:
    build: ./app/
    image: ml-service-app:latest
    container_name: ml-service-app
    restart: unless-stopped
    env_file:
      - ./app/.env
    volumes:
      - ./app/src:/app
    networks:
      - ml-service-network
    depends_on:
      database:
        condition: service_healthy   # ждём готовности БД перед автоинициализацией
      rabbitmq:
        condition: service_healthy   # publisher должен видеть живой брокер
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # 2. Reverse proxy на основе Nginx.
  # Зависит от app, проксирует HTTP-запросы, наружу — порты 80 и 443.
  web-proxy:
    build: ./web-proxy/
    container_name: ml-service-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ml-service-network

  # 3. Брокер сообщений RabbitMQ (образ с management UI на порту 15672).
  # Данные очередей сохраняются в именованном volume — не теряются
  # при удалении контейнера или директории проекта.
  # Фиксированный hostname обязателен: RabbitMQ хранит данные в
  # mnesia/rabbit@<hostname>; без него новый контейнер получает случайное
  # имя узла и не видит данные, записанные предыдущим контейнером.
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ml-service-rabbitmq
    hostname: rabbitmq
    restart: on-failure
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    volumes:
      - rabbitmq_volume:/var/lib/rabbitmq
    networks:
      - ml-service-network

  # 4. База данных PostgreSQL.
  # Конфигурация — через переменные окружения из корневого .env
  # (в docker-compose.yml секретов нет). Данные — в именованном
  # volume, переживают удаление контейнера или директории проекта.
  database:
    image: postgres:16
    container_name: ml-service-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    networks:
      - ml-service-network

  # 5. ML-воркеры (Задание №5): consumers очереди ml_tasks.
  # Собираются из того же образа, что и app, но вместо API запускают worker.py.
  # deploy.replicas: 2 — минимум два воркера; RabbitMQ раздаёт задачи
  # round-robin (prefetch_count=1 в worker.py — честное распределение).
  worker:
    build: ./app/
    command: python worker.py
    restart: on-failure
    env_file:
      - ./app/.env
    volumes:
      - ./app/src:/app
    deploy:
      replicas: 2
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ml-service-network

networks:
  ml-service-network:
    name: ml-service-network
    driver: bridge

volumes:
  postgres_volume:
  rabbitmq_volume:
