version: "3.8"

services:

  # 1. Backend-приложение.
  # Конфигурация — через env_file, исходники — через volumes.
  # Порты наружу НЕ пробрасываются: доступ только через web-proxy.
  app:
    build: ./app/
    image: ml-service-app:latest
    container_name: ml-service-app
    restart: unless-stopped
    env_file:
      - ./app/.env
    volumes:
      - ./app/src:/app
    networks:
      - ml-service-network
    depends_on:
      - database
      - rabbitmq
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # 2. Reverse proxy на основе Nginx.
  # Зависит от app, проксирует HTTP-запросы, наружу — порты 80 и 443.
  web-proxy:
    build: ./web-proxy/
    container_name: ml-service-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ml-service-network

  # 3. Брокер сообщений RabbitMQ (образ с management UI на порту 15672).
  # Данные очередей сохраняются в именованном volume — не теряются
  # при удалении контейнера или директории проекта.
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ml-service-rabbitmq
    restart: on-failure
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    volumes:
      - rabbitmq_volume:/var/lib/rabbitmq
    networks:
      - ml-service-network

  # 4. База данных PostgreSQL.
  # Конфигурация — через переменные окружения из корневого .env
  # (в docker-compose.yml секретов нет). Данные — в именованном
  # volume, переживают удаление контейнера или директории проекта.
  database:
    image: postgres:16
    container_name: ml-service-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    networks:
      - ml-service-network

networks:
  ml-service-network:
    name: ml-service-network
    driver: bridge

volumes:
  postgres_volume:
  rabbitmq_volume:
